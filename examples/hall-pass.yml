# Copy to .github/hall-pass.yml in the consumer repo.
version: 1

actions:
  approve: true          # the App approves qualifying PRs
  autoMerge: true        # turn on GitHub auto-merge for qualifying PRs
  mergeMethod: squash    # squash | merge | rebase
  mergeWhenClean: false  # true: merge directly when nothing is left to wait for (only once CI is required)
  labels: true           # apply hall-pass:<category> labels
  comment: true          # sticky summary comment

classifiers:
  path-category:
    mode: shadow         # switch to active after reviewing a backtest
    categories:
      docs-only:
        allow: ["docs/**", "adr/**", "**/*.md", "**/*.mdx"]
        # Behavioural markdown (SKILL.md, CLAUDE.md, AGENTS.md, .claude/, .cursor/,
        # prompts, agent instructions, .github/ …) is denied by a built-in list
        # that config cannot switch off. Add repo-specific paths here.
        deny:
          - ".github/**"
          - "**/CLAUDE.md"
          - "**/AGENTS.md"
          - "**/prompts/**"
          - "**/CHANGELOG.md"

  # Dependabot patch updates. Needs the App's key as a Dependabot secret too:
  # see "Using with Dependabot" in the hall-pass README.
  dependabot-safe:
    mode: shadow
    botLogins: ["dependabot[bot]"]
    allowedCommitters: ["web-flow"]
    branchPrefix: "dependabot/"
    allowedUpdateTypes: ["version-update:semver-patch"]
    allowPreOneZero: false
    denyPackages: ["@apollo/*", "graphql"]
    allowedFiles: ["**/package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
